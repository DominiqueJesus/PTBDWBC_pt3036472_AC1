
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Minha Página</title>
  </head>
  <body>
    <h1>Bem-vindo à minha página!</h1>
    <p>Esta é uma estrutura HTML básica.</p>
    <br>

    <!-- A tag <ul> é usada para criar uma lista não ordenada (com marcadores) -->
    <ul id="Lista não numerada">
        <li>Primeiro item</li>
        <li>Segundo item</li>
    </ul>

    <!-- A tag <ol> é usada para criar uma lista ordenada (numerada) -->
    <ol id="Lista numerada">
        <li>Primeiro item</li>
        <li>Segundo item</li>
    </ol>

  </body>
</html>
